attributeName="width" dur="26.0s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.5846;0.5873;0.5901;0.5928;0.5955;0.5983;0.6010;0.6037;0.6065;0.6092;0.6119;0.6146;0.6174;0.6201;0.6228;0.6256;0.6283;0.6310;0.6337;0.6365;0.6392;0.6419;0.6447;0.6474;0.6501;0.6529;0.6556;0.6583;0.6610;0.6638;0.6665;0.6692;0.9385;1" values="0;0.0;8.4;16.8;25.2;33.6;42.0;50.4;58.8;67.2;75.6;84.0;92.4;100.8;109.2;117.6;126.0;134.4;142.8;151.2;159.6;168.0;176.4;184.8;193.2;201.6;210.0;218.4;226.8;235.2;243.6;252.0;260.4;260.4;0"/></rect></clipPath>
