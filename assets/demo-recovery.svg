<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="t d">
  <title id="t">Crash after the click: never re-sent, then recovered</title>
  <desc id="d">Animated terminal with real outputs. The first generate ends with an unknown send state after one click. Typing generate again is refused. resume observes the chat read-only, finds the finished image, and the total number of clicks stays one.</desc>
