  <text x="600.0" y="35" text-anchor="middle" font-family="Inter,'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="14" fill="#7C89B5">the click's acknowledgement is lost  ·  scripted page</text>
  <line x1="1" y1="58" x2="1199" y2="58" stroke="#2A3466" stroke-width="1.5"/>
  <text x="72" y="112" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="14" fill="#EAF0FF" clip-path="url(#tc0)" xml:space="preserve" textLength="487.2" lengthAdjust="spacingAndGlyphs">headless.py generate --run-id fox --prompt-file prompt.txt</text><text x="48" y="112" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="14" font-weight="700" fill="#9C8BFF" opacity="0">&#10095;<animate attributeName="opacity" dur="26.0s" repeatCount="indefinite" calcMode="linear" keyTimes="0.0000;0.0288;0.0385;0.9385;0.9692;1.0000" values="0;0;1;1;0;0"/></text><text x="72" y="138" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="14" font-weight="400" fill="#C9D2F0" opacity="0" xml:space="preserve" textLength="756.0" lengthAdjust="spacingAndGlyphs">{"error": "send_click_uncertain", "error_kind": "ambiguous_send", "send_state": "unknown",<animate attributeName="opacity" dur="26.0s" repeatCount="indefinite" calcMode="linear" keyTimes="0.0000;0.1615;0.1712;0.9385;0.9692;1.0000" values="0;0;1;1;0;0"/></text><text x="72" y="164" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="14" font-weight="400" fill="#C9D2F0" opacity="0" xml:space="preserve" textLength="327.6" lengthAdjust="spacingAndGlyphs"> "send_clicks": 1, "retry_safe": false}<animate attributeName="opacity" dur="26.0s" repeatCount="indefinite" calcMode="linear" keyTimes="0.0000;0.1615;0.1712;0.9385;0.9692;1.0000" values="0;0;1;1;0;0"/></text><text x="72" y="190" font-family="Inter,'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#F3B8A5" opacity="0" xml:space="preserve"># Send was clicked, but its acknowledgement was lost: is the image coming? Unknown, so the tool will not click again.<animate attributeName="opacity" dur="26.0s" repeatCount="indefinite" calcMode="linear" keyTimes="0.0000;0.2154;0.2250;0.9385;0.9692;1.0000" values="0;0;1;1;0;0"/></text><text x="72" y="242" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="14" fill="#EAF0FF" clip-path="url(#tc1)" xml:space="preserve" textLength="487.2" lengthAdjust="spacingAndGlyphs">headless.py generate --run-id fox --prompt-file prompt.txt</text><text x="48" y="242" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="14" font-weight="700" fill="#9C8BFF" opacity="0">&#10095;<animate attributeName="opacity" dur="26.0s" repeatCount="indefinite" calcMode="linear" keyTimes="0.0000;0.3212;0.3308;0.9385;0.9692;1.0000" values="0;0;1;1;0;0"/></text><text x="72" y="268" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="14" font-weight="400" fill="#C9D2F0" opacity="0" xml:space="preserve" textLength="840.0" lengthAdjust="spacingAndGlyphs">{"error": "run_exists_use_resume", "error_kind": "run_state", "send_clicks": 1, "retry_safe": false}<animate attributeName="opacity" dur="26.0s" repeatCount="indefinite" calcMode="linear" keyTimes="0.0000;0.4538;0.4635;0.9385;0.9692;1.0000" values="0;0;1;1;0;0"/></text><text x="72" y="294" font-family="Inter,'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#F3B8A5" opacity="0" xml:space="preserve"># The same command typed again is refused: the run exists, and the click count is still 1.<animate attributeName="opacity" dur="26.0s" repeatCount="indefinite" calcMode="linear" keyTimes="0.0000;0.5000;0.5096;0.9385;0.9692;1.0000" values="0;0;1;1;0;0"/></text><text x="72" y="346" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="14" fill="#EAF0FF" clip-path="url(#tc2)" xml:space="preserve" textLength="260.4" lengthAdjust="spacingAndGlyphs">headless.py resume --run-id fox</text><text x="48" y="346" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="14" font-weight="700" fill="#9C8BFF" opacity="0">&#10095;<animate attributeName="opacity" dur="26.0s" repeatCount="indefinite" calcMode="linear" keyTimes="0.0000;0.5827;0.5923;0.9385;0.9692;1.0000" values="0;0;1;1;0;0"/></text><text x="72" y="372" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="14" font-weight="700" fill="#7BE3C6" opacity="0" xml:space="preserve" textLength="814.8" lengthAdjust="spacingAndGlyphs">{"send_state": "confirmed", "generation_state": "completed", "send_clicks": 1, "recovered": true}<animate attributeName="opacity" dur="26.0s" repeatCount="indefinite" calcMode="linear" keyTimes="0.0000;0.6923;0.7019;0.9385;0.9692;1.0000" values="0;0;1;1;0;0"/></text><text x="72" y="398" font-family="Inter,'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#F3B8A5" opacity="0" xml:space="preserve"># resume only observes the retained chat, read-only. It found the finished image. Clicks in total: 1.<animate attributeName="opacity" dur="26.0s" repeatCount="indefinite" calcMode="linear" keyTimes="0.0000;0.7385;0.7481;0.9385;0.9692;1.0000" values="0;0;1;1;0;0"/></text>
  <text x="48" y="466" font-family="Inter,'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#C3CCEC" opacity="0" xml:space="preserve">Real code: the failure-semantics harness runs the real generate and resume commands against a scripted page. No browser, no ChatGPT request.<animate attributeName="opacity" dur="26.0s" repeatCount="indefinite" calcMode="linear" keyTimes="0.0000;0.0154;0.0250;0.9385;0.9692;1.0000" values="0;0;1;1;0;0"/></text><text x="48" y="490" font-family="Inter,'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#C3CCEC" opacity="0" xml:space="preserve">Output trimmed to the key fields. The coloured comments are explanations, not program output.<animate attributeName="opacity" dur="26.0s" repeatCount="indefinite" calcMode="linear" keyTimes="0.0000;0.0154;0.0250;0.9385;0.9692;1.0000" values="0;0;1;1;0;0"/></text>
