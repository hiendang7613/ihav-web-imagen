<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="410" viewBox="0 0 1200 410" role="img" aria-labelledby="t d">
  <title id="t">The never-twice lifeline</title>
  <desc id="d">Package, receipt not_sent, receipt intent written to disk, one click, then observe the owned turn: confirmed downloads the original file, unknown is only resumed read-only.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="410" gradientUnits="userSpaceOnUse"><stop stop-color="#111B37"/><stop offset=".55" stop-color="#1C1A45"/><stop offset="1" stop-color="#2E1C4F"/></linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8C99D0"/></marker>
  </defs>
  <rect x="1" y="1" width="1198" height="408" rx="24" fill="url(#bg)" stroke="#2F3A73" stroke-width="2"/>
  <rect x="40" y="70" width="168" height="84" rx="14" fill="#18214A" stroke="#3A4478" stroke-width="2"/><text x="124.0" y="102" text-anchor="middle" font-family="Inter,'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#EAF0FF">package</text><text x="124.0" y="126" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="13" fill="#9AA7CF">prompt + references</text><rect x="252" y="70" width="168" height="84" rx="14" fill="#18214A" stroke="#3A4478" stroke-width="2"/><text x="336.0" y="102" text-anchor="middle" font-family="Inter,'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#EAF0FF">receipt</text><text x="336.0" y="126" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="13" fill="#9AA7CF">send_state: not_sent</text><rect x="464" y="70" width="168" height="84" rx="14" fill="#2A2358" stroke="#9C8BFF" stroke-width="2"/><text x="548.0" y="102" text-anchor="middle" font-family="Inter,'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#EAF0FF">receipt</text><text x="548.0" y="126" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="13" fill="#9AA7CF">send_state: intent</text><rect x="676" y="70" width="168" height="84" rx="14" fill="#3B2A4F" stroke="#F3B8A5" stroke-width="2"/><text x="760.0" y="102" text-anchor="middle" font-family="Inter,'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#FFE9E1">one click</text><text x="760.0" y="126" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="13" fill="#9AA7CF">Send, exactly once</text><rect x="888" y="70" width="248" height="84" rx="14" fill="#18214A" stroke="#74D7D0" stroke-width="2"/><text x="1012.0" y="102" text-anchor="middle" font-family="Inter,'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#EAF0FF">observe the owned turn</text><text x="1012.0" y="126" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="13" fill="#9AA7CF">confirmed or unknown</text>
  <path d="M212 112.0 L248 112.0" stroke="#5E6BA0" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><path d="M424 112.0 L460 112.0" stroke="#5E6BA0" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><path d="M636 112.0 L672 112.0" stroke="#5E6BA0" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><path d="M848 112.0 L884 112.0" stroke="#5E6BA0" stroke-width="2.5" fill="none" marker-end="url(#arr)"/>
  <g><rect x="458" y="30" width="180" height="26" rx="13" fill="#2A2358" stroke="#9C8BFF" stroke-width="1.5"/><text x="548.0" y="48" text-anchor="middle" font-family="Inter,'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#CFC7FF">written to disk first</text></g>
  <path d="M982.0 158 L880 258" stroke="#7BE3C6" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><path d="M942.0 158 L510 258" stroke="#F3B8A5" stroke-width="2.5" fill="none" stroke-dasharray="6 6" marker-end="url(#arr)"/>
  <rect x="760" y="262" width="240" height="74" rx="14" fill="#14352F" stroke="#7BE3C6" stroke-width="2"/><text x="880.0" y="294" text-anchor="middle" font-family="Inter,'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#D5FFF3">confirmed</text><text x="880.0" y="318" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="13" fill="#9AA7CF">download the original file</text>
  <rect x="330" y="262" width="360" height="74" rx="14" fill="#3A2530" stroke="#F3B8A5" stroke-width="2"/><text x="510.0" y="294" text-anchor="middle" font-family="Inter,'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#FFE9E1">unknown</text><text x="510.0" y="318" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="13" fill="#9AA7CF">resume or status: read-only observe</text>
  <text x="1160" y="388" text-anchor="end" font-family="Inter,'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="15" fill="#B8C2E6">After the click, a crash, a timeout or Ctrl-C can only lead to <tspan font-weight="700" fill="#F3B8A5">resume</tspan>: the tool never makes a second click.</text>
</svg>
